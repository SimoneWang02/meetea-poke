services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: meetea-poke-app:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - meetea

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: meetea-poke-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app-storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - meetea

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - meetea
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  meetea:
    driver: bridge

volumes:
  mysql-data:
  app-storage:
